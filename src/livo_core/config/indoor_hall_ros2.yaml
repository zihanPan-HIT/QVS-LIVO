    time_offset:
      imu_time_offset: 0.0
      img_time_offset: 0.0
      exposure_time_init: 0.0

    preprocess:
      point_filter_num: 1
      filter_size_surf: 0.1
      lidar_type: 1
      scan_line: 4
      scan_rate: 10
      blind: 0.3
      feature_extract_enabled: false

    vio:
      max_iterations: 5
      outlier_threshold: 1000
      img_point_cov: 100
      patch_size: 8
      patch_pyrimid_level: 4
      normal_en: true
      raycast_en: false
      inverse_composition_en: false
      exposure_estimate_en: true
      inv_expo_cov: 0.1
      grid_size: 5
      grid_n_height: 17

    imu:
      imu_en: true
      imu_int_frame: 30
      gravity_est_en: true
      ba_bg_est_en: true
      acc_cov: 0.5
      gyr_cov: 0.3

    lio:
      max_iterations: 5
      dept_err: 0.02
      beam_err: 0.05
      min_eigen_value: 0.0025
      voxel_size: 0.5
      max_layer: 2
      max_points_num: 50
      layer_init_num: [5, 5, 5, 5, 5]
      data_retention_time: 0.0

    local_map:
      map_sliding_en: false
      half_map_size: 100
      sliding_thresh: 8.0

    uav:
      imu_rate_odom: false
      gravity_align_en: false

    publish:
      dense_map_en: true
      pub_effect_point_en: false
      pub_plane_en: false
      pub_scan_num: 1
      blind_rgb_points: 0.0

    evo:
      seq_name: "indoor_hall_20260609_ros1"
      pose_output_en: false

    pcd_save:
      pcd_save_en: false
      colmap_output_en: false
      filter_size_pcd: 0.01
      interval: -1

    debug:
      plot_time: -10.0
      frame_cnt: 6

    camera:
      model: "Pinhole"
      width: 640
      height: 480
      scale: 1.0
      fx: 605.4541096693224
      fy: 607.0726057195229
      cx: 330.2128595328623
      cy: 246.7226069133648
      d0: 0.1581950204629965
      d1: -0.31314626114596156
      d2: 0.0009058382881218566
      d3: -0.0013061458729652182

    multi_camera:
      enable: true
      topics:
        front: "/camera/color/image_raw"
        right: "/camera_right/color/image_raw"
        back: "/camera_back/color/image_raw"
        left: "/camera_left/color/image_raw"
      extrinsics:
